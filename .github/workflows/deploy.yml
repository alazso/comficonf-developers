name: Build and push the developers image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE: ghcr.io/alazso/comficonf-developers

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Resolve build metadata
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # Released version of com.comficonf:comficonf-api on Maven Central; 0.1.0 when the metadata cannot be read.
          VERSION=$(curl -fsSL https://repo1.maven.org/maven2/com/comficonf/comficonf-api/maven-metadata.xml \
            | sed -n 's:.*<release>\(.*\)</release>.*:\1:p' | head -n 1 || true)
          echo "artifact_version=${VERSION:-0.1.0}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            COMFICONF_ARTIFACT_VERSION=${{ steps.meta.outputs.artifact_version }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.meta.outputs.short_sha }}
